<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Wireframe - Gestão de Tarefas</title>
<link rel="stylesheet" href="css/wireframe.css">
</head>
<body>
<div class="tela">
    <div class="titulo">(TODO LIST)</div>

    <div class="linha-input">
        <div class="input"></div>
        <div class="circulo">+</div>
    </div>

    <div class="filtros"><b>TODAS</b> / CONCLUÍDAS / NÃO CONCLUÍDAS</div>

    <div class="item">
        <div class="box"></div>
        <div class="txt">Estudar para a prova de PHP</div>
        <div>🗑️</div>
    </div>
    <div class="item ok">
        <div class="box">✓</div>
        <div class="txt">Fazer o mapa de navegação</div>
        <div>🗑️</div>
    </div>
    <div class="item">
        <div class="box"></div>
        <div class="txt">Desenhar os wireframes</div>
        <div>🗑️</div>
    </div>

    <div class="nota">(+) → inclusao.php &nbsp;|&nbsp; ☑ → status.php &nbsp;|&nbsp; 🗑️ → exclusao.php &nbsp;|&nbsp; concluída = cinza + riscado</div>
</div>
</body>
</html>
